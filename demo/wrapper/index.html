<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Hazard Review</title>
<style>
  :root{
    --bg:#09090b; --panel:#18181b; --border:#27272a; --border2:#3f3f46;
    --text:#fafafa; --muted:#a1a1aa; --dim:#71717a; --amber:#f59e0b;
    --high:#c62828; --moderate:#f9a825; --low:#2e7d32; --na:#9e9e9e;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  header h1{font-size:16px;font-weight:700;letter-spacing:.04em}
  header h1 span{color:var(--amber)}
  header .sub{font-size:11px;color:var(--dim)}
  #summary{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;gap:26px;flex-wrap:wrap;background:var(--panel)}
  .stat .n{font-size:18px;font-weight:700}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  #main{flex:1;display:flex;min-height:0}
  #list{width:320px;min-width:260px;border-right:1px solid var(--border);overflow-y:auto}
  .row{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row:hover{background:var(--panel)}
  .row.active{background:#26262b;border-left:3px solid var(--amber);padding-left:11px}
  .row .name{font-size:12.5px;font-weight:600}
  .row .amt{font-size:12px;color:var(--muted);white-space:nowrap}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px;border:1px solid}
  .b-HIGH{background:rgba(198,40,40,.15);color:#ef9a9a;border-color:rgba(198,40,40,.45)}
  .b-MODERATE{background:rgba(249,168,37,.15);color:#ffd54f;border-color:rgba(249,168,37,.4)}
  .b-LOW{background:rgba(46,125,50,.15);color:#a5d6a7;border-color:rgba(46,125,50,.4)}
  .b-NA{background:rgba(158,158,158,.14);color:#d4d4d8;border-color:rgba(158,158,158,.35)}
  #mapwrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0}
  #detail{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:88%;background:rgba(9,9,11,.96);border-left:1px solid var(--border2);overflow-y:auto;padding:18px;transform:translateX(100%);transition:transform .22s ease;backdrop-filter:blur(4px)}
  #detail.open{transform:none}
  #detail h2{font-size:15px;margin-bottom:2px}
  #detail .close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
  .peril{border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px}
  .peril h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .peril .big{font-size:20px;font-weight:800;margin-top:6px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--border)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)} .kv .v{text-align:right}
  .callout{border:1px solid rgba(161,161,170,.35);background:rgba(113,113,122,.12);border-radius:6px;padding:10px;margin-top:12px;font-size:11.5px;color:#d4d4d8}
  .callout .tag{display:inline-block;border:1px solid rgba(161,161,170,.4);background:rgba(113,113,122,.2);border-radius:4px;padding:1px 7px;font-weight:700;font-size:10px;margin-bottom:6px}
  .prov{margin-top:12px;font-size:10.5px;color:var(--dim);font-style:italic}
  .fires{margin-top:12px}
  .fires h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .chip{display:inline-block;font-size:10px;border:1px solid var(--border2);border-radius:10px;padding:2px 8px;margin:0 4px 4px 0;color:#d4d4d8}
  .btn{font:600 11px/1 inherit;color:var(--text);background:#26262b;border:1px solid var(--border2);border-radius:6px;padding:6px 10px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--amber)}
  #uploadform{display:none;position:absolute;top:0;left:0;right:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border2);padding:14px 20px;gap:10px;align-items:center;flex-wrap:wrap}
  #uploadform.open{display:flex}
  #uploadform input[type=text]{background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:6px 10px;font:inherit;font-size:12px}
  #uploadform input[type=file]{font-size:11px;color:var(--muted)}
  #uploadform .hint{font-size:10.5px;color:var(--dim)}
  #maploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
  @media (max-width:760px){#list{width:44%}}
</style>
</head>
<body>
<header>
  <h1>PORTFOLIO HAZARD REVIEW <span id="ptitle"></span></h1>
  <div class="sub">Powered by governed spatial analysis &middot; Felt collaboration canvas</div>
</header>
<div id="summary"></div>
<div id="main">
  <div id="list"></div>
  <div id="mapwrap">
    <form id="uploadform">
      <strong style="font-size:12px">New portfolio</strong>
      <input type="text" id="pname" placeholder="Portfolio name" required>
      <input type="file" id="csvfile" accept=".csv" required>
      <button class="btn" type="submit">Analyze</button>
      <span class="hint">CSV columns: name, latitude, longitude (or address) &middot; max 50 rows &middot;
        <a id="samplecsv" download="sample_portfolio.csv" style="color:var(--amber)">sample CSV</a></span>
    </form>
    <div id="map"><div id="maploading">Loading Felt map&hellip;</div></div>
    <div id="detail"></div>
  </div>
</div>

<script src="./app.js"></script>
<script type="module">
  import { Felt } from "https://esm.run/@feltmaps/js-sdk";
  window.embedFelt = async function (mapId) {
    const c = document.getElementById("map");
    c.innerHTML = '<div id="maploading">Loading Felt map&hellip;</div>';
    try {
      const felt = await Felt.embed(c, mapId, {
        uiControls: { cooperativeGestures: false, fullScreenButton: false },
      });
      APP.wireMap(felt);
    } catch (e) {
      const ld = document.getElementById("maploading");
      if (ld) ld.textContent = "Map embed unavailable \u2014 open directly: felt.com/map/" + mapId;
      console.error("Felt embed failed:", e);
    }
  };
  window.embedFelt(APP.CONFIG.feltMapId);
</script>
</body>
</html>
